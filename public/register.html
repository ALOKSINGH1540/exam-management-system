<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration - Exam Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <h2>New Student Registration</h2>
        <form id="registerForm">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="regName" required placeholder="Enter your full name">
            </div>
            <div class="input-group">
                <label>Email ID</label>
                <input type="email" id="regEmail" required placeholder="student@university.edu">
            </div>
            <div class="input-group">
                <label>Create Password</label>
                <input type="password" id="regPassword" required placeholder="Create a strong password">
            </div>
            <button type="submit" class="btn">Register Now</button>
        </form>
        <div class="link-group">
            <a href="login.html">Already registered? Log in here</a>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
